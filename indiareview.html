<!DOCTYPE html>
<html>
<head>
    <title>IndiaReview - Honest Reviews</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        header {
            background: #0a66c2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: auto;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
        }

        button {
            background: #0a66c2;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #004182;
        }

        .rating {
            color: orange;
        }
    </style>
</head>

<body>

<header>
    <h1>IndiaReview 🇮🇳</h1>
    <p>Share your honest experience</p>
</header>

<div class="container">

    <div class="card">
        <h2>Write a Review</h2>
        <input type="text" id="businessName" placeholder="Business Name" required>
        <select id="rating">
            <option value="5">★★★★★ (5)</option>
            <option value="4">★★★★ (4)</option>
            <option value="3">★★★ (3)</option>
            <option value="2">★★ (2)</option>
            <option value="1">★ (1)</option>
        </select>
        <textarea id="reviewText" placeholder="Write your review..." rows="4"></textarea>
        <button onclick="addReview()">Submit Review</button>
    </div>

    <h2>All Reviews</h2>
    <div id="reviews"></div>

</div>

<script>

let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

function displayReviews() {
    let reviewDiv = document.getElementById("reviews");
    reviewDiv.innerHTML = "";

    reviews.forEach((review, index) => {
        reviewDiv.innerHTML += `
            <div class="card">
                <h3>${review.business}</h3>
                <p class="rating">${"★".repeat(review.rating)}</p>
                <p>${review.text}</p>
                <button onclick="deleteReview(${index})">Delete</button>
            </div>
        `;
    });
}

function addReview() {
    let business = document.getElementById("businessName").value;
    let rating = document.getElementById("rating").value;
    let text = document.getElementById("reviewText").value;

    if(business === "" || text === "") {
        alert("Please fill all fields");
        return;
    }

    reviews.push({ business, rating, text });
    localStorage.setItem("reviews", JSON.stringify(reviews));

    document.getElementById("businessName").value = "";
    document.getElementById("reviewText").value = "";

    displayReviews();
}

function deleteReview(index) {
    reviews.splice(index, 1);
    localStorage.setItem("reviews", JSON.stringify(reviews));
    displayReviews();
}

displayReviews();

</script>

</body>
</html>
